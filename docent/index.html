<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
<title>도슨트 · 「나의 동네, 낯선 동네」</title>
<meta property="og:title" content="도슨트 · 「나의 동네, 낯선 동네」">
<meta property="og:description" content="성북구 도시 문화 사진전 「나의 동네, 낯선 동네」 공간별 음성 안내">
<meta property="og:url" content="https://www.shootingmythings.studio/docent">
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도슨트 · 「나의 동네, 낯선 동네」</title>
<meta property="og:title" content="도슨트 · 「나의 동네, 낯선 동네」">
<meta property="og:description" content="성북구 도시 문화 사진전 「나의 동네, 낯선 동네」 공간별 음성 안내">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
html,body{margin:0;background:#ffffff;}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;color:#141414;-webkit-font-smoothing:antialiased;}
a{color:#141414;text-decoration:none;}a:hover{color:#707070;}
</style>
</helmet>
<div style="max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;">
  <audio ref="{{ audioRef }}" onEnded="{{ onEnded }}" onTimeUpdate="{{ onTime }}" onPlay="{{ onPlayEv }}" onPause="{{ onPauseEv }}" preload="auto"></audio>

  <div style="position:sticky;top:0;z-index:5;background:rgba(244,244,244,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 -1px 0 #efefef;">
    <div style="padding:8px 20px 4px;">
      <div style="position:relative;height:24px;margin:0 calc((100% / 12));">
        <div style="position:absolute;left:0;right:0;top:11px;height:2px;border-radius:9999px;background:#e6e6e6;"></div>
        <div style="position:absolute;left:0;width:{{ lineW }};top:11px;height:2px;border-radius:9999px;background:#141414;transition:width .55s cubic-bezier(.4,0,.2,1);"></div>
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
          <span style="position:absolute;top:9px;left:{{ t.x }};width:6px;height:6px;margin-left:-3px;border-radius:9999px;background:{{ t.dot }};transition:background .3s;"></span>
        </sc-for>
        <div style="position:absolute;top:0;left:{{ lineW }};transform:translateX(-50%);width:26px;height:24px;display:flex;align-items:center;justify-content:center;background:#f4f4f4;border-radius:9999px;transition:left .55s cubic-bezier(.4,0,.2,1);">
          <sc-if value="{{ mk.walk }}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff6b70"><circle cx="13.5" cy="3.6" r="2.1"></circle><path d="M10.6 7.3c.5-.4 1.2-.6 1.9-.5l1.4.2c.8.1 1.4.7 1.6 1.4l.8 2.6 2.4 1.2a1 1 0 0 1-.9 1.8l-2.8-1.4a1 1 0 0 1-.5-.6l-.4-1.3-1 3.6 2.5 2.4c.2.2.3.4.3.7l.5 4.3a1 1 0 0 1-2 .2l-.4-3.9-2.6-2.4-1 3.1a1 1 0 0 1-.3.5l-2.8 2.9a1 1 0 0 1-1.4-1.4l2.6-2.7 1.9-6.7-1.1.6-1 2.6a1 1 0 0 1-1.9-.7l1.2-2.9c.1-.2.3-.4.5-.5z"></path></svg>
          </sc-if>
          <sc-if value="{{ mk.camera }}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff6b70"><path d="M9 4.5a1 1 0 0 0-.8.4L7 6.5H4.5A2.5 2.5 0 0 0 2 9v8.5A2.5 2.5 0 0 0 4.5 20h15a2.5 2.5 0 0 0 2.5-2.5V9a2.5 2.5 0 0 0-2.5-2.5H17l-1.2-1.6a1 1 0 0 0-.8-.4zM12 9.2a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path></svg>
          </sc-if>
          <sc-if value="{{ mk.pin }}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff6b70"><path d="M12 2a7 7 0 0 0-7 7c0 5.1 6.1 12.3 6.3 12.6a.9.9 0 0 0 1.4 0C12.9 21.3 19 14.1 19 9a7 7 0 0 0-7-7zm0 4.3a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4z"></path></svg>
          </sc-if>
          <sc-if value="{{ mk.house }}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff6b70"><path d="M11.3 3.3a1 1 0 0 1 1.4 0l8 7.4a1 1 0 0 1-.7 1.8h-1v7a1.5 1.5 0 0 1-1.5 1.5h-3a1 1 0 0 1-1-1v-4.5h-3V20a1 1 0 0 1-1 1h-3A1.5 1.5 0 0 1 5 19.5v-7H4a1 1 0 0 1-.7-1.8z"></path></svg>
          </sc-if>
          <sc-if value="{{ mk.dot }}" hint-placeholder-val="{{ false }}">
            <span style="width:12px;height:12px;border-radius:9999px;background:#ff6b70;box-shadow:0 0 0 4px #ffe1e3;"></span>
          </sc-if>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
          <button onClick="{{ t.go }}" aria-label="{{ t.n }}번 {{ t.zl }}" style="height:22px;border:0;background:none;padding:0;font:inherit;font-size:11px;font-weight:{{ t.zw }};color:{{ t.fg }};letter-spacing:-0.01em;cursor:pointer;transition:color .3s;">{{ t.zl }}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div lang="{{ lang }}" style="padding:18px 20px 0;display:flex;flex-direction:column;gap:22px;opacity:{{ fadeOpacity }};transform:translateX({{ fadeShift }});transition:{{ fadeTrans }};will-change:opacity,transform;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span style="min-width:0;font-size:12px;font-weight:600;color:#8a8a8a;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ ui.exh }}</span>
      <a href="/" style="justify-self:end;display:flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:#707070;white-space:nowrap;">{{ ui.about }} <span style="font-size:14px;">›</span></a>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;box-shadow:inset 0 -1px 0 #ececec;">
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0;">
        <h1 style="margin:0;font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-0.04em;word-break:keep-all;text-wrap:balance;">{{ sec.title }}</h1>
      </div>
      <span style="flex:none;width:58px;height:58px;border-radius:9999px;background:#141414;color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;"><span style="font-size:9px;font-weight:600;color:rgba(255,255,255,0.65);letter-spacing:0.02em;">{{ sec.tab }}</span><span style="font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;">{{ sec.n }}</span></span>
    </div>

    <sc-if value="{{ noAudio }}" hint-placeholder-val="{{ false }}">
      <div style="padding:16px 18px;border-radius:16px;background:#f3f3f3;font-size:14px;line-height:1.55;color:#4a4a4a;">{{ ui.noAudio }}</div>
    </sc-if>
    <sc-if value="{{ enNote }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#f3f3f3;font-size:13.5px;line-height:1.55;color:#4a4a4a;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#707070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
        <span>{{ ui.note }}</span>
      </div>
    </sc-if>

    <div style="display:flex;flex-direction:column;gap:18px;">
      <sc-for list="{{ paras }}" as="p" hint-placeholder-count="4">
        <p onClick="{{ p.play }}" style="margin:0;font-size:17px;line-height:1.8;letter-spacing:-0.015em;color:{{ p.color }};text-align:justify;word-break:{{ p.wb }};hyphens:{{ p.hy }};-webkit-hyphens:{{ p.hy }};cursor:{{ p.cursor }};transition:color .3s;">{{ p.t }}</p>
        <sc-if value="{{ p.rule }}" hint-placeholder-val="{{ false }}"><div style="height:1px;margin:6px 0;background:#e3e3e3;"></div></sc-if>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px;">
      <sc-for list="{{ extras }}" as="x" hint-placeholder-count="1">
        <div style="padding:18px 18px 20px;border-radius:16px;background:#f5f5f5;display:flex;flex-direction:column;gap:10px;">
          <span style="font-size:13px;font-weight:700;letter-spacing:-0.01em;">{{ x.h }}</span>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <sc-for list="{{ x.lines }}" as="l" hint-placeholder-count="1">
              <span style="font-size:14.5px;line-height:1.65;color:#3a3a3a;text-align:justify;word-break:keep-all;">{{ l }}</span>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ coach }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeCoach }}" style="position:fixed;inset:0;z-index:30;background:rgba(10,10,10,0.78);cursor:pointer;color:#ffffff;">
      <div style="position:relative;max-width:480px;height:100%;margin:0 auto;">
        <div style="position:absolute;left:20px;right:20px;top:100px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;">
          <svg width="18" height="26" viewBox="0 0 18 26" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25V2M2 9l7-7 7 7"></path></svg>
          <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;">{{ co.t1 }}</span>
          <span style="font-size:13px;line-height:1.55;color:rgba(255,255,255,0.8);word-break:keep-all;">{{ co.a1 }}<br>{{ co.b1 }}</span>
        </div>
        <div style="position:absolute;left:20px;right:20px;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;">
          <span style="width:44px;height:44px;border-radius:9999px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;"><span style="width:14px;height:14px;border-radius:9999px;background:#ffffff;"></span></span>
          <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;">{{ co.t2 }}</span>
          <span style="font-size:13px;line-height:1.55;color:rgba(255,255,255,0.8);word-break:keep-all;">{{ co.a2 }}<br>{{ co.b2 }}</span>
        </div>

        <div style="position:absolute;left:0;right:0;top:58%;display:flex;justify-content:center;">
          <span style="height:40px;padding:0 20px;border-radius:9999px;background:#ffffff;color:#141414;font-size:14px;font-weight:700;display:flex;align-items:center;">{{ co.start }}</span>
        </div>
      </div>
      <sc-for list="{{ coachTips }}" as="c" hint-placeholder-count="0">
        <span style="position:absolute;left:{{ c.rl }};top:{{ c.rt }};width:{{ c.rw }};height:{{ c.rh }};border-radius:9999px;box-shadow:0 0 0 2px #ffffff, 0 0 0 6px rgba(255,255,255,0.18);pointer-events:none;"></span>
        <div style="position:absolute;left:{{ c.lx }};top:{{ c.ly }};transform:{{ c.tf }};display:flex;flex-direction:{{ c.fd }};align-items:{{ c.al }};gap:6px;pointer-events:none;white-space:nowrap;">
          <span style="font-size:13px;font-weight:700;padding:{{ c.pd }};border-radius:9999px;background:{{ c.bg }};color:{{ c.fc }};">{{ c.t }}</span>
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:{{ c.sa }};margin:{{ c.am }};transform:rotate({{ c.rot }});"><path d="M6 1v17M1 13l5 5 5-5"></path></svg>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="height:124px;flex:none;"></div>
  <div ref="{{ barRef }}" style="position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 -1px 0 #ececec;">
    <div role="group" aria-label="Language" style="position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;height:30px;padding:3px;box-sizing:border-box;border-radius:9999px;background:rgba(239,239,239,0.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(20,20,20,0.12);">
        <button onClick="{{ setKo }}" aria-pressed="{{ isKo }}" style="height:24px;padding:0 9px;border:0;border-radius:9999px;background:{{ koBg }};color:{{ koFg }};box-shadow:{{ koSh }};font:inherit;font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:background .2s,color .2s;">한글</button>
        <button onClick="{{ setEn }}" aria-pressed="{{ isEn }}" style="height:24px;padding:0 9px;border:0;border-radius:9999px;background:{{ enBg }};color:{{ enFg }};box-shadow:{{ enSh }};font:inherit;font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:background .2s,color .2s;">EN</button>
        <button onClick="{{ setJa }}" aria-pressed="{{ isJa }}" style="height:24px;padding:0 9px;border:0;border-radius:9999px;background:{{ jaBg }};color:{{ jaFg }};box-shadow:{{ jaSh }};font:inherit;font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:background .2s,color .2s;">日本語</button>
      </div>
    <div style="height:2px;background:#f0f0f0;"><div style="height:100%;width:{{ progress }};background:#ff6b70;transition:width .3s linear;"></div></div>
    <div style="max-width:440px;margin:0 auto;padding:0 12px env(safe-area-inset-bottom);">
      <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;height:60px;">
        <div style="justify-self:start;display:flex;align-items:center;"><button ref="{{ prevRef }}" onClick="{{ goPrev }}" disabled="{{ noPrev }}" style="height:36px;padding:0 12px 0 8px;font-size:12px;border:0;border-radius:0;background:transparent;color:#141414;font:inherit;font-size:13px;font-weight:600;cursor:pointer;opacity:{{ prevOpacity }};display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg><span>{{ ui.prev }}</span></button></div>
        <div style="height:48px;border-radius:9999px;background:{{ playBg }};color:#ffffff;display:flex;align-items:center;box-shadow:0 4px 12px rgba(20,20,20,0.16);">
          <button ref="{{ playRef }}" onClick="{{ toggle }}" disabled="{{ noAudio }}" aria-label="{{ playLabel }}" style="width:58px;height:48px;border:0;background:none;padding:0 0 0 4px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg>
          </sc-if>
          <sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" style="margin-left:2px;"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"></path></svg>
          </sc-if>
          </button>
          <span style="width:1px;height:20px;background:rgba(255,255,255,0.28);"></span>
          <button ref="{{ rateRef }}" onClick="{{ cycleRate }}" aria-label="{{ ui.rateAria }}" style="height:48px;padding:0 18px 0 14px;border:0;background:none;color:#ffffff;font:inherit;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;">{{ rateShort }}</button>
        </div>
        <div style="justify-self:end;display:flex;align-items:center;"><button ref="{{ nextRef }}" onClick="{{ goNext }}" style="opacity:{{ nextOpacity }};height:36px;padding:0 8px 0 12px;font-size:12px;border:0;border-radius:0;background:transparent;color:#141414;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none;"><span>{{ nextLabel }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button></div>
        
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;marker&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;걷는 사람&quot;,&quot;카메라&quot;,&quot;지도 핀&quot;,&quot;집&quot;,&quot;점&quot;],&quot;default&quot;:&quot;카메라&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;진행 표시&quot;}}">
const A = '/docent/audio/';
const SECTIONS = [
  { title: '전시에 오신 것을 환영합니다', paras: [
    ['성북구 도시 문화 사진전 「나의 동네, 낯선 동네」에 오신 것을 환영합니다. 공간마다 놓인 안내문들을 따라 편하신 속도로 천천히 둘러봐 주세요.', A + '1-1.mp3'],
    ['본 전시는 일상 속 소중한 순간을 사진과 영상, 글로 담아내는 크리에이티브 미디어 팀 Shootingmythings가 주최하고 가구를 디자인하고 제작하는 데 관심 있는 세 명의 건축학도가 모인 가꾸가팀이 협력하여 진행됩니다. 따라서 사진 외에도 영상, 가구를 함께 관람하실 수 있습니다.', A + '1-2.mp3'],
    ['가장 먼저 전시장 정면의 큰 포토월 앞에서 전시 설명을 들어주세요. 이후에는 인포메이션에서 무인 관람 유의사항을 확인하신 후 리플렛을 챙겨주세요. 좌측 편에 위치한 테이블의 사진과 엽서들은 관람을 마친 후 별도 안내되오니, 벽면과 바닥에 부착된 화살표를 따라 순서대로 관람을 진행 해주시면 감사하겠습니다.', A + '1-3.mp3'],
    ['한양도성의 북쪽에 자리해 이름 붙여진 성북에는 굽이진 골목의 오래된 주택가와 세월을 간직한 건축물, 새로 조성된 뉴타운이 나란히 놓여 있습니다. 이곳에서 나고 자란 사람, 학업과 일 때문에 잠시 머무는 사람, 새 보금자리를 찾아 정착한 사람. 서로 다른 삶이 교차하며 성북만의 풍경을 만들어 갑니다.', A + '1-4.mp3'],
    ['이번 전시는 성북을 고향으로 두지 않은 이들의 시선에서 시작 되었습니다. 전시를 준비한 저희도 부산, 광주, 의정부 등 저마다 다른 곳에서 학교와 일을 이유로 올라와 성북에 자리를 잡았습니다. 처음 만난 성북은 분명 낯선 동네였습니다.', A + '1-5.mp3'],
    ['이곳에 터를 잡은 지 10년, 5년, 3년. 저마다 성북에서 보낸 시간은 다르지만, 매일 오가는 길 위에서 마주한 소소한 풍경들이 어느새 익숙하고 정겨운 일상의 일부가 되었다는 점은 같습니다. 무심코 지나쳤던 골목과 오래된 건물, 계절에 따라 달라지는 거리의 표정까지. 우리의 시선이 머물렀던 순간들을 약 6개월간의 작업을 통해 작품으로 담았습니다.', A + '1-6.mp3'],
    ['낯선 동네가 나의 동네가 되는 데에는 얼마나 많은 시간이 필요 할까요. 어쩌면 그 변화는 특별한 사건이 아닌, 매일 같은 길을 걷고 익숙한 풍경에 눈길을 주는 작은 순간들에서 시작되는지도 모릅니다.', A + '1-7.mp3'],
    ['이번 전시는 우리가 살아가는 성북의 일상을 다시 바라보면서 준비하였습니다. 성북에 이제 막 오신 분들께는 낯선 동네가 나의 동네가 되는 작은 계기가, 오래 살아오신 분들께는 늘 다니던 길 바깥에 숨어 있던 성북의 풍경을 새로 발견하는 시간이 되기를 바랍니다.', A + '1-8.mp3']],
    extras: [{ h: '관람 순서', lines: ['① 한눈에 담는 성북', '② 풍경에 담긴 사람들의 이야기 ', '③ 일상의 풍경에 머무는 시간 ', ''] }] },
  { title: '한눈에 담는 성북', paras: [
    ['첫 번째 공간에서는 성북을 하늘에서 내려다봅니다. 입구의 사진 네 장에는 성북에서만 볼 수 있는 풍경을 담았습니다. 위에서부터 차례로 재개발을 기다리는 정릉골, 국내 유일의 오각형 아파트인 대광아파트, 산자락을 따라 아파트가 빼곡히 들어선 서경대 일대, 그리고 재개발이 한창인 가운데에도 제자리를 지키는 교회가 있는 장위 재개발 지구입니다. 다른 곳에서는 쉽게 볼 수 없는 풍경들을 한자리에 모았습니다. 그리고 네 장을 위에서부터 이어 보면, 재개발을 기다리는 옛 주택가에서 아파트가 들어서고, 다시 재건축을 기다리기까지 한 도시가 나고 자라고 다시 태어나는 시간, 말하자면 도시의 생애가 펼쳐집니다.', A + '2-1.mp3'],
    ['안쪽 공간에서는 드론으로 촬영한 영상 한 편이 상영됩니다. 화면 속에서 골목과 주거지, 그리고 도시를 둘러싼 자연이 하나로 이어지는 모습을 따라가 보세요. 땅 위를 걸을 때는 미처 보지 못했던 동네의 생김새와, 서로 맞닿은 풍경의 결이 눈에 들어오기 시작합니다.', A + '2-2.mp3'],
    ['멀리서 바라본 이 풍경을 기억해 두시면, 다음 공간에서 만날 사람들의 이야기가 어디에서 펼쳐지는지 더 잘 그려질 것입니다.', A + '2-3.mp3']],
    extras: [{ h: '평소에는 보기 어려운 성북', lines: ['성북구는 군사 시설이 밀집한 지역이어서 드론 촬영이 쉽게 허가되지 않습니다. 이 영상은 이번 전시를 위해 관할 군사 기관으로부터 정식 촬영 허가를 받아 담아낸 성북의 모습입니다.', '자리에 편하게 앉아 영상을 끝까지 감상해 주세요.'] }] },
  { title: '풍경에 담긴 사람들의 이야기', paras: [
    ['긴 복도를 따라 이어지는 두 번째 공간에서는 성북의 다양한 모습을 담은 사진과, 주민들의 경험을 담은 네 편의 인터뷰 영상을 함께 선보입니다.', A + '3-1.mp3'],
    ['같은 동네에 머물러도 저마다 기억하는 성북은 다를 것이라고 저희들은 생각했습니다. 그래서 작가들의 시선뿐 아니라, 실제로 성북에서 살아온 20대부터 50대까지의 주민들을 만나 이야기를 들었습니다. 어떻게 성북에 살게 되었는지, 지금 이곳에서 어떻게 살아가고 있는지, 새로 이사 온 이웃에게 어떤 말을 건네고 싶은지 물었습니다.', A + '3-2.mp3'],
    ['그리고 마지막으로 ‘성북의 얼굴’은 무엇인지, 성북 하면 가장 먼저 떠오르는 풍경과 장소를 여쭈었습니다. 이 공간의 사진들은 그 대답 속 풍경을 담은 것입니다.', A + '3-3.mp3'],
    ['사진과 목소리를 나란히 따라가다 보면, 하나의 동네에 서로 다른 시간과 삶이 겹겹이 쌓여 있다는 것을 발견하실 수 있습니다.', A + '3-4.mp3'],
    ['입구의 나무 벽에서는 성북구가 어떤 풍경을 담고 있는지 먼저 보여 드립니다. 성북구를 떠올렸을 때 연상되는 다양한 풍경을 언덕 위에서 담아 보았습니다.', A + '3-5.mp3'],
    ['이어지는 액자는 이 공간의 중심 작품으로, 네 가지 주제로 나뉘어 있습니다. “성북구에 이런 곳도 있었어?”라는 물음을 가지고 보셔도 좋지만, 어떤 사진끼리 한 묶음일지, 왜 이 순서로 놓였을지 상상하며 보시는 것도 추천드립니다.', A + '3-6.mp3'],
    ['TV에서는 3분 길이의 인터뷰 영상이 두 편씩 재생됩니다. 성북에서 살아가며 쌓은 기억과 추억, 그리고 새로 온 청년들에게 건네는 메시지를 담았습니다. 전체 영상은 마지막 공간에서도 보실 수 있습니다.', A + '3-7.mp3'],
    ['출구의 나무 벽에서는 인터뷰에 참여해 주신 동네 가게 모습들을 만나 보실 수 있습니다. 실제 Shootingmythings 팀 작가들이 오랫동안 단골로 찾는 가게들로, 맛이 아주 훌륭하니 전시를 보신 뒤 들러 보셔도 좋겠습니다.', A + '3-8.mp3']],
    extras: [{ h: '관람 순서', lines: ['① 입구 나무 벽 · 언덕 위에서 본 성북', '② 액자 · 네 가지 주제의 사진', '③  TV · 주민 인터뷰 영상', '④ 출구 나무 벽 · 인터뷰 참여 가게 모습'] }] },
  { title: '일상의 풍경에 머무는 시간', paras: [
    ['마지막 공간에서는 성북의 거리와 골목을 가까이 마주합니다. 활기찬 도심과 골목, 재개발 지역의 오래된 주택부터 자연과 어우러진 주거지까지, 다양한 모습을 사진으로 만나실 수 있습니다. 앞선 두 공간보다는 더욱 가까운 시선임을 확인해보실 수 있습니다.', A + '4-1.mp3'],
    ['무심코 지나치던 골목과 오래된 건물, 계절과 함께 사라져 간 거리의 표정까지. 낯선 동네가 나의 동네가 되려면 작은 것에도 눈길을 주는 시간이 필요하다고 생각했습니다. 그래서 동네 곳곳에 잠시 머물며 찍은 사진 90점을 이 공간에 모았습니다.', A + '4-2.mp3'],
    ['사진은 크게 여섯 개의 판으로 나뉘어 있습니다. 판 하나마다 작은 주제가 있고 왼쪽에서 오른쪽으로 큰 맥락 안에서 연결됩니다. 어떤 주제를 가지고 6개의 판을 순서대로 배치하였을 지 상상해보시며 관람하는 것을 추천드립니다. 또 가로줄과 세로줄마다 색감과 스토리를 상상하며 사진을 배치했으니, 색의 흐름과 작가의 배치 의도 스토리를 상상해보며 따라가 보는 것도 하나의 즐거움이 될 것입니다.', A + '4-3.mp3']],
    extras: [{ h: '이렇게 보시길 권합니다', lines: ['① 왼쪽에서 오른쪽으로 천천히 사진을 눈에 담아 주세요.', '② 끝나는 지점에 놓인 가꾸가의 가구 설명을 읽어 보세요.', '③ 마지막으로 평상에 앉아 사진들을 한 번 더 바라봐 주세요.'] }] },
  { title: '소소평상', paras: [
    ['소소평상은 세 명의 건축학도가 모인 가꾸가 팀에서 제작한 가구입니다. 두 번의 야외 전시를 마친 뒤, 이번 전시에서 소소평상의 세 번째 전시를 진행하게 되었습니다. 가구는 실제 앉아보실 수 있는 가구로 편하게 앉은 후 가꾸가 사진들과 책을 보시며 관람을 진행 해주시면 감사하겠습니다. ', A + '5-1.mp3'],
    ['성북구에는 공원이나 하천처럼 쉴 수 있는 공간들이 잘 마련되어 있지만, 대부분의 가구는 독립적으로 놓여 있거나 한 방향을 바라보도록 되어 있습니다. 그래서 가꾸가는 사람들이 서로 마주 보고 이야기를 나누며, 자연스럽게 모일 수 있는 가구를 만들어 보고자 했습니다.', A + '5-2.mp3'],
    ['그 과정에서 사람들이 자유롭게 둘러앉아 일상을 나누던 전통 가구인 ‘평상’에 주목했습니다. 기존 평상과 달리 중앙을 비워 사람들이 안쪽을 향해 서로 마주 앉을 수 있도록 했습니다. 비워낸 중심을 무엇으로 채울지 고민하면서, 성북구 골목의 정겨운 풍경을 만들어내는 요소 중 하나가 집 앞에 놓인 화분과 자연스럽게 자라나는 식물이라고 생각했습니다. 그래서 그 요소인 식재로 중심을 채우고, 사람들이 식물을 매개로 서로 마주하고 이야기를 나누며 함께 공간을 만들어갈 수 있도록 기획했습니다.', A + '5-3.mp3'],
    ['왼쪽은 첫 번째 전시 사진입니다. 첫 번째 전시는 평상이 합체된 형태로 오동공원 오동물빛정원에서 진행했습니다. 이미 쉼이 잘 이루어지고 있는 공원에 소소평상을 설치하여, 혼자 풍경을 바라보며 쉬는 것뿐만 아니라 사람들이 서로 마주하고 식재를 나누어가지며 소통할 수 있는 새로운 쉼의 방식을 더하고자 했습니다.', A + '5-4.mp3'],
    ['오른쪽 사진은 두 번째 전시 사진입니다. 두 번째 전시는 사람들이 주로 이동하는 공간인 정릉천 청덕교에서 진행했습니다. 소소평상은 모듈을 분리하고 결합할 수 있는 가구로, 이곳에서는 모듈을 재구성해 교량 위에는 벤치를, 계단에는 테이블을 배치했습니다. 이를 통해 단순히 지나가던 교량과 계단이 사람들이 앉아 쉬거나 책을 읽으며 머무를 수 있는 공간이 되도록 했습니다.', A + '5-5.mp3'],
    ['중앙에 전시된 사진에서는 소소평상의 제작 과정을 살펴보실 수 있습니다. 상판 재료를 자르고 세척하거나, 목재를 후가공하는 등 직접 가구를 제작했던 과정들이 담겨 있습니다. 프로젝트의 기획부터 제작, 전시까지의 더 자세한 이야기는 평상 중앙 테이블에 놓인 아카이빙 북을 통해 만나보실 수 있습니다.', A + '5-6.mp3'],
    ['가구에도 자유롭게 앉아 책과 전시를 감상해 보시기 바랍니다. 관람을 모두 마쳤다면, 출구 우측에 위치한 관람 명부와 방명록 작성을 부탁드리겠습니다. 관람 명부는 참가 인원 보고 목적을 위해 활용되며, 전시가 끝난 후 모두 폐기됩니다.', A + '5-7.mp3']],
    extras: [
      { h: '사진은 이렇게 놓여 있어요', lines: ['좌측 |  첫 번째 전시, 오동근린공원', '중앙 |  소소평상 제작 과정', '우측 |  두 번째 전시, 정릉천 청덕교'] },
      { h: '관람을 마치셨다면', lines: ['출구에 놓인 관람 명부와 방명록을 작성해 주세요. \n방명록은 팀별로 준비되어 있습니다.'] }] },
  { title: 'OFF THE RECORD', paras: [
    ['마지막 장소에는 주제에 맞지 않아 남겨진 사진들과 엽서, 스티커가 위치하고 있습니다. 다른 사진들과의 연관성은 없지만 한장 한장 들여다보시면 매력 있는 부분들을 찾으실 수 있습니다. 왼쪽 아래 위치한 스티커는 무료로 제공중에 있으니 원하시는 스티커가 있다면 여러장 가져가주시면 감사하겠습니다.', A + '6-1.mp3'],
    ['새로운 건물이 들어서고 오래된 주택이 사라지는 동안에도 사람들은 저마다의 자리에서 일상을 이어 갑니다. 분주한 도심과 재개발을 앞둔 주택가, 좁은 골목과 자연에 둘러싸인 주거지가 모두 성북의 현재입니다. 이번 전시는 장소를 사진으로 기록하는 동시에, 그곳에서 살아온 사람들의 목소리를 함께 담아 하나의 동네를 바라보는 다양한 시선을 전하고자 했습니다.', A + '6-2.mp3'],
    ['오늘 만난 풍경 가운데 익숙한 곳이 있었다면, 그곳을 새롭게 바라보는 계기가 되었기를 바랍니다. 낯선 골목이 더 많았다면, 전시장을 나서는 길에 그중 한 곳을 직접 걸어 보셔도 좋겠습니다.', A + '6-3.mp3'],
    ['관람해 주셔서 감사합니다.', A + '6-4.mp3']],

const EN = [
  { title: "Welcome to the Exhibition", paras: [
    "Welcome to 「My Neighborhood, Unfamiliar Neighborhood」, an urban culture photography exhibition of Seongbuk-gu. Please follow the guides placed in each space and take your time looking around at your own pace.",
    "This exhibition is organized by Shootingmythings, a creative media team that captures precious everyday moments through photography, video, and writing, in collaboration with Gakkuga, a team of three architecture students who design and build furniture. Alongside the photographs, you can also enjoy video works and furniture.",
    "First, please listen to the introduction in front of the large photo wall facing the entrance. Then check the self-guided viewing notes at the information desk and pick up a leaflet. The photos and postcards on the table to your left will be introduced after you finish the tour, so please follow the arrows on the walls and floor and view the exhibition in order.",
    "Named for its place north of Hanyangdoseong, the old city wall of Seoul, Seongbuk is home to winding alleys of old houses, buildings that hold the passage of time, and newly built 'new towns', all side by side. People born and raised here, people staying for a while for school or work, people who found a new home and settled down — their different lives cross paths and shape a landscape that belongs only to Seongbuk.",
    "This exhibition began from the perspective of those who do not call Seongbuk their hometown. We, the team behind it, also came from different places — Busan, Gwangju, Uijeongbu — for school and work, and settled in Seongbuk. The Seongbuk we first met was, without a doubt, an unfamiliar neighborhood.",
    "Ten years, five years, three years. Each of us has spent a different length of time here, but we share one thing: the small scenes we passed every day have quietly become a familiar and warm part of our daily lives. Alleys we walked past without a thought, old buildings, the changing face of the streets with each season. Over about six months, we turned the moments where our eyes lingered into these works.",
    "How much time does it take for an unfamiliar neighborhood to become your own? Perhaps the change begins not with a special event, but with small moments — walking the same streets each day and glancing at familiar scenery.",
    "We prepared this exhibition by looking again at everyday life in Seongbuk, where we live. For those who have just arrived, we hope it becomes a small step toward making an unfamiliar neighborhood your own. For those who have lived here long, we hope it is a time to discover the Seongbuk hidden just beyond the streets you always walk."],
    extras: [{ h: "Viewing Order", lines: ["① Seongbuk at a Glance", "② Stories Within the Landscape", "③ Time Spent in Everyday Scenes"] }] },
  { title: "Seongbuk at a Glance", paras: [
    "In the first space, you look down on Seongbuk from the sky. The four photographs at the entrance capture scenes found only in Seongbuk. From the top: Jeongneung-gol, awaiting redevelopment; Daegwang Apartments, the only pentagonal apartment building in Korea; the area around Seokyeong University, where apartments crowd along the mountainside; and the Jangwi redevelopment district, where a church holds its ground amid ongoing redevelopment. We have gathered in one place scenes rarely seen elsewhere. Read the four photographs from top to bottom, and the life of a city unfolds — from old houses awaiting redevelopment, to apartments rising, to waiting once again for reconstruction: a city being born, growing, and being reborn.",
    "In the inner space, a video filmed by drone is screened. Follow how the alleys, homes, and the nature surrounding the city connect into one on screen. You will begin to notice the shape of the neighborhood and the texture of landscapes touching one another — things you could not see while walking on the ground.",

  { title: "Stories Within the Landscape", paras: [
    "The second space, along the long corridor, presents photographs of Seongbuk's many faces together with four interview videos sharing residents' experiences.",
    "We believed that even people living in the same neighborhood each remember a different Seongbuk. So beyond our own view as artists, we met residents in their twenties to fifties who have actually lived in Seongbuk and listened to their stories. We asked how they came to live here, how they live here now, and what they would like to say to neighbors who have just moved in.",
    "Finally, we asked what 'the face of Seongbuk' is — the scenery and places that first come to mind when they think of Seongbuk. The photographs in this space capture the scenes from those answers.",
    "As you follow the photographs and voices side by side, you will discover that different times and lives are layered within a single neighborhood.",

  { title: "Time Spent in Everyday Scenes", paras: [
    "In the last space, you meet Seongbuk's streets and alleys up close. From the lively downtown and alleys and the old houses of redevelopment areas to homes in harmony with nature, its many faces appear in photographs. You will notice that the view here is much closer than in the two previous spaces.",

    extras: [{ h: "How We Suggest Viewing", lines: ["① Take in the photographs slowly, from left to right.", "② Read the description of Gakkuga's furniture at the end.", "③ Finally, sit on the pyeongsang and look at the photographs once more."] }] },
  { title: "Soso Pyeongsang", paras: [
    "Soso Pyeongsang is furniture made by Gakkuga, a team of three architecture students. After two outdoor exhibitions, this is its third. You are welcome to sit on it — please make yourself comfortable and enjoy Gakkuga's photographs and book.",
    "Seongbuk-gu has plenty of places to rest, such as parks and streams, but most of the furniture there stands alone or faces only one direction. So Gakkuga set out to make furniture where people could face each other, talk, and naturally gather.",
    "Along the way, they turned to the pyeongsang, a traditional Korean platform where people sat around freely and shared their daily lives. Unlike a traditional pyeongsang, its center is left empty so that people can sit facing inward, toward one another. While deciding what should fill the empty center, they thought of the potted plants placed in front of houses and the plants that grow there naturally — one of the things that make Seongbuk's alleys feel so warm. So they filled the center with plants, so that people could face each other, talk, and create a space together, with plants as the medium.",
    "On the left is a photograph of the first exhibition, held at Odong Mulbit Garden in Odong Park, with the modules combined into one platform. By placing Soso Pyeongsang in a park already well loved for rest, they hoped to add a new way of resting — not only gazing at the scenery alone, but facing one another, sharing plants, and connecting.",
    "The photograph on the right shows the second exhibition, held at Cheongdeok Bridge over Jeongneungcheon Stream, a place people mostly pass through. Soso Pyeongsang is modular furniture that can be separated and combined; here, the modules were rearranged into benches on the bridge and tables on the stairs. This turned a bridge and stairs that people simply walked past into a place to sit, rest, and read.",
    "The photographs in the center show how Soso Pyeongsang was made — cutting and washing the top materials, finishing the wood, and other steps of building the furniture by hand. You can find the full story, from planning and making to exhibiting, in the archive book on the table in the middle of the pyeongsang.",

    "While new buildings go up and old houses disappear, people carry on with their daily lives in their own places. The busy downtown, houses awaiting redevelopment, narrow alleys, and homes surrounded by nature are all the Seongbuk of today. This exhibition set out to record places in photographs while also capturing the voices of the people who have lived there, sharing the many ways of seeing a single neighborhood.",

  { title: "日常の風景にとどまる時間", paras: [
    "最後のスペースでは、城北の街並みや路地を間近に見つめます。活気ある都心と路地、再開発地域の古い住宅から自然と調和した住宅地まで、さまざまな姿を写真でご覧いただけます。前の2つのスペースよりも、ぐっと近いまなざしであることがお分かりいただけるでしょう。",

  { title: "ソソピョンサン（小小平床）", paras: [
